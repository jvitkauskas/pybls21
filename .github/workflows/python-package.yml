name: Python package

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        pymodbus: [latest]
        include:
          - python-version: '3.10'
            pymodbus: minimum
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test tools
        run: python -m pip install -e '.[dev]'
      - name: Test minimum supported pymodbus
        if: matrix.pymodbus == 'minimum'
        run: python -m pip install pymodbus==3.13.1
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -m coverage run -m unittest -v
      - run: python -m coverage report

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify installed wheel and release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m pip install dist/*.whl
          python -I - <<'PY'
          import os
          from importlib.metadata import distribution
          from importlib.resources import files
          from pybls21 import S21Client, ClimateDevice

          package = distribution("pybls21")
          tag = os.environ.get("RELEASE_TAG")
          if tag and tag != f"v{package.version}":
              raise SystemExit(f"Release tag {tag} does not match version {package.version}")
          assert files("pybls21").joinpath("py.typed").is_file()
          paths = {str(path) for path in package.files}
          for name in ("LICENSE", "THIRD_PARTY_NOTICES"):
              assert any(path.endswith(f"/licenses/{name}") for path in paths), name
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
